name: Update contribution snake

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/animations.yml"

permissions:
  contents: read

concurrency:
  group: profile-snake
  cancel-in-progress: false

jobs:
  generate:
    if: github.repository == 'thiagoguerra-199/thiagoguerra-199'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: thiagoguerra-199
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#3b82f6&color_dots=#16161f,#31204f,#623299,#8b3dd1,#a855f7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
