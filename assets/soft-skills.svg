<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="14" fill="#0b1020"/><rect x="20" y="18" width="470" height="94" rx="10" fill="#11192b" stroke="#26324b"/><circle cx="44" cy="47" r="5" fill="#a855f7"/><text x="62" y="53" fill="#e2e8f0" font-size="19" font-family="Segoe UI,Arial">Problem Solving</text><text x="40" y="84" fill="#94a3b8" font-size="14" font-family="Segoe UI,Arial">Break down a problem before writing code.</text><rect x="510" y="18" width="470" height="94" rx="10" fill="#11192b" stroke="#26324b"/><circle cx="534" cy="47" r="5" fill="#a855f7"/><text x="552" y="53" fill="#e2e8f0" font-size="19" font-family="Segoe UI,Arial">Logical Thinking</text><text x="530" y="84" fill="#94a3b8" font-size="14" font-family="Segoe UI,Arial">Build clear, step-by-step solutions.</text><rect x="20" y="126" width="470" height="94" rx="10" fill="#11192b" stroke="#26324b"/><circle cx="44" cy="155" r="5" fill="#a855f7"/><text x="62" y="161" fill="#e2e8f0" font-size="19" font-family="Segoe UI,Arial">Teamwork</text><text x="40" y="192" fill="#94a3b8" font-size="14" font-family="Segoe UI,Arial">Work toward a shared project goal.</text><rect x="510" y="126" width="470" height="94" rx="10" fill="#11192b" stroke="#26324b"/><circle cx="534" cy="155" r="5" fill="#a855f7"/><text x="552" y="161" fill="#e2e8f0" font-size="19" font-family="Segoe UI,Arial">Communication</text><text x="530" y="192" fill="#94a3b8" font-size="14" font-family="Segoe UI,Arial">Explain decisions and ask clear questions.</text><rect x="20" y="234" width="470" height="94" rx="10" fill="#11192b" stroke="#26324b"/><circle cx="44" cy="263" r="5" fill="#a855f7"/><text x="62" y="269" fill="#e2e8f0" font-size="19" font-family="Segoe UI,Arial">Adaptability</text><text x="40" y="300" fill="#94a3b8" font-size="14" font-family="Segoe UI,Arial">Adjust as requirements and tools change.</text><rect x="510" y="234" width="470" height="94" rx="10" fill="#11192b" stroke="#26324b"/><circle cx="534" cy="263" r="5" fill="#a855f7"/><text x="552" y="269" fill="#e2e8f0" font-size="19" font-family="Segoe UI,Arial">Creativity</text><text x="530" y="300" fill="#94a3b8" font-size="14" font-family="Segoe UI,Arial">Explore practical approaches to an idea.</text><rect x="20" y="342" width="470" height="94" rx="10" fill="#11192b" stroke="#26324b"/><circle cx="44" cy="371" r="5" fill="#a855f7"/><text x="62" y="377" fill="#e2e8f0" font-size="19" font-family="Segoe UI,Arial">Organization</text><text x="40" y="408" fill="#94a3b8" font-size="14" font-family="Segoe UI,Arial">Keep tasks, code, and documentation clear.</text><rect x="510" y="342" width="470" height="94" rx="10" fill="#11192b" stroke="#26324b"/><circle cx="534" cy="371" r="5" fill="#a855f7"/><text x="552" y="377" fill="#e2e8f0" font-size="19" font-family="Segoe UI,Arial">Critical Thinking</text><text x="530" y="408" fill="#94a3b8" font-size="14" font-family="Segoe UI,Arial">Compare options and question assumptions.</text><rect x="20" y="450" width="470" height="94" rx="10" fill="#11192b" stroke="#26324b"/><circle cx="44" cy="479" r="5" fill="#a855f7"/><text x="62" y="485" fill="#e2e8f0" font-size="19" font-family="Segoe UI,Arial">Continuous Learning</text><text x="40" y="516" fill="#94a3b8" font-size="14" font-family="Segoe UI,Arial">Improve through practice and feedback.</text><rect x="510" y="450" width="470" height="94" rx="10" fill="#11192b" stroke="#26324b"/><circle cx="534" cy="479" r="5" fill="#a855f7"/><text x="552" y="485" fill="#e2e8f0" font-size="19" font-family="Segoe UI,Arial">Attention to Detail</text><text x="530" y="516" fill="#94a3b8" font-size="14" font-family="Segoe UI,Arial">Review behavior, naming, and edge cases.</text></svg>